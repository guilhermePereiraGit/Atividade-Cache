spring.application.name=Hash-Cache

# Banco H2 em memoria: os dados nao sobrevivem ao encerramento da aplicacao.
spring.datasource.url=jdbc:h2:mem:conteudos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas pelas entidades e as remove ao encerrar o contexto.
spring.jpa.hibernate.ddl-auto=create-drop

# Console para inspecionar o banco durante o desenvolvimento local.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Simula uma fonte lenta somente nas buscas de conteudo.
app.fonte.atraso-milissegundos=2000